<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Password Reset Error</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f9fafb;
            color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1.25rem;
            border-radius: 50%;
            background: #fef2f2;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ef4444;
            font-size: 32px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 0.95rem;
            color: #6b7280;
            margin-bottom: 1.75rem;
        }

        .button {
            display: inline-block;
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            background: #111827;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s ease;
        }

        .button:hover {
            background: #1f2937;
        }

        .secondary {
            display: block;
            margin-top: 0.75rem;
            font-size: 0.85rem;
            color: #6b7280;
            text-decoration: none;
        }

        .secondary:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">⚠️</div>

        <h1>Password reset failed</h1>
        {{ error_message|default:"" }}
        <p>Please request new reset link</p>
    </div>
</body>
</html>
