<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Itemory - Email Verified</title>
  <style>
        :root {
            color-scheme: light dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #eef2ff 0%, #f9fafb 55%, #f9fafb 100%);
            color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .container {
            background: #ffffff;
            padding: 3rem 2.5rem 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(17, 24, 39, 0.08), 0 2px 6px rgba(17, 24, 39, 0.04);
            max-width: 420px;
            width: 100%;
            text-align: center;
            animation: rise 0.5s ease-out;
        }

        .icon {
            display: block;
            width: 72px;
            height: 72px;
            margin: 0 auto 1.5rem;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
            animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
        }

        .badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #6366f1;
            background: #eef2ff;
            padding: 0.3rem 0.7rem;
            border-radius: 999px;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 0 0 0.6rem;
            letter-spacing: -0.01em;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #6b7280;
            margin: 0 0 1.75rem;
        }

        .divider {
            height: 1px;
            background: #f3f4f6;
            margin: 1.5rem 0;
        }

        .hint {
            font-size: 0.8rem;
            color: #9ca3af;
            margin: 0;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pop {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: radial-gradient(circle at top, #1e1b4b 0%, #0b0f19 55%, #0b0f19 100%);
                color: #f3f4f6;
            }

            .container {
                background: #131826;
                box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.3);
            }

            .badge {
                background: rgba(99, 102, 241, 0.15);
                color: #a5b4fc;
            }

            p, .hint {
                color: #9ca3af;
            }

            .divider {
                background: #1f2937;
            }
        }
    </style>
</head>
<body>
  <div class="container">
    <img class="icon" src="/static/images/logo.png" alt="Itemory">
    <span class="badge">Verified</span>
    <h1>Email confirmed</h1>
    <p>Your email address has been successfully verified. You're all set to continue using Itemory.</p>
    <div class="divider"></div>
    <p class="hint">You can close this window and return to the app.</p>
  </div>
</body>
</html>
