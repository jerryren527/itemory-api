<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Itemory - Reset Password</title>
  <style>
        :root {
            color-scheme: light dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #eef2ff 0%, #f9fafb 55%, #f9fafb 100%);
            color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .container {
            background: #ffffff;
            padding: 3rem 2.5rem 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(17, 24, 39, 0.08), 0 2px 6px rgba(17, 24, 39, 0.04);
            max-width: 420px;
            width: 100%;
            text-align: center;
            animation: rise 0.5s ease-out;
        }

        .icon {
            display: block;
            width: 72px;
            height: 72px;
            margin: 0 auto 1.5rem;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
            animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
        }

        .badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #6366f1;
            background: #eef2ff;
            padding: 0.3rem 0.7rem;
            border-radius: 999px;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 0 0 0.6rem;
            letter-spacing: -0.01em;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #6b7280;
            margin: 0 0 1.75rem;
        }

        .divider {
            height: 1px;
            background: #f3f4f6;
            margin: 1.5rem 0;
        }

        .hint {
            font-size: 0.8rem;
            color: #9ca3af;
            margin: 0;
        }

        form {
            text-align: left;
        }

        .error {
            font-size: 0.85rem;
            color: #ef4444;
            background: #fef2f2;
            border-radius: 8px;
            padding: 0.6rem 0.75rem;
            margin: 0 0 1.25rem;
            text-align: left;
        }

        .field {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: #111827;
        }

        input[type="password"] {
            width: 100%;
            padding: 0.65rem 0.75rem;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="password"]:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .field-hint {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: 0.35rem;
        }

        .button {
            display: inline-block;
            width: 100%;
            padding: 0.7rem 1.5rem;
            border-radius: 10px;
            background: linear-gradient(135deg, #818cf8, #6366f1);
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: inherit;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .button:hover {
            opacity: 0.9;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pop {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: radial-gradient(circle at top, #1e1b4b 0%, #0b0f19 55%, #0b0f19 100%);
                color: #f3f4f6;
            }

            .container {
                background: #131826;
                box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.3);
            }

            .badge {
                background: rgba(99, 102, 241, 0.15);
                color: #a5b4fc;
            }

            p, .hint, .field-hint {
                color: #9ca3af;
            }

            label {
                color: #f3f4f6;
            }

            .divider {
                background: #1f2937;
            }

            .error {
                background: rgba(239, 68, 68, 0.12);
                color: #fca5a5;
            }

            input[type="password"] {
                background: #0b0f19;
                border-color: #1f2937;
                color: #f3f4f6;
            }
        }
    </style>
</head>
<body>
  <div class="container">
    <img class="icon" src="/static/images/logo.png" alt="Itemory">
    <span class="badge">Reset Password</span>
    <h1>Set a new password</h1>
    <p>Choose a strong password for your account.</p>

    <form method="POST" action="">
        {% csrf_token %}

        {% if error_message %}
            <p class="error">{{ error_message }}</p>
        {% endif %}

        <div class="field">
            <label for="password">New password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
                minlength="8"
            />
            <div class="field-hint">Minimum 8 characters</div>
        </div>

        <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <input
                type="password"
                id="confirmPassword"
                name="confirm_password"
                required
            />
        </div>

        <button type="submit" class="button">
            Reset password
        </button>
    </form>
  </div>
</body>
</html>
