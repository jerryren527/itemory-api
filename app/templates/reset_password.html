<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        /* ---- your existing styles ---- */
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f9fafb;
            color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1.25rem;
            border-radius: 50%;
            background: #ecfdf5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #10b981;
            font-size: 32px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 0.95rem;
            color: #6b7280;
            margin-bottom: 1.75rem;
        }

        .button {
            display: inline-block;
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            background: #111827;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s ease;
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .button:hover {
            background: #1f2937;
        }

        /* ---- minimal form additions ---- */
        form {
            text-align: left;
        }

        .field {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.35rem;
        }

        input[type="password"] {
            width: 100%;
            padding: 0.55rem 0.65rem;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 0.9rem;
            outline: none;
        }

        input[type="password"]:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.15);
        }

        .hint {
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 0.35rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">🔒</div>

        <h1>Reset your password</h1>
        <p>Please enter a new password below.</p>

        <form method="POST" action="">
            <!-- Django will inject CSRF token if this is a template -->
            {% csrf_token %}

            <div class="field">
                <p>
                    {{ error_message|default:"" }}
                </p>
                <label for="password">New password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    minlength="8"
                />
                <div class="hint">Minimum 8 characters</div>
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirm_password"
                    required
                />
            </div>

            <button type="submit" class="button">
                Reset password
            </button>
        </form>
    </div>
</body>
</html>
